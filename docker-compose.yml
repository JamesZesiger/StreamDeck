services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEKO_PUBLIC_URL: ${NEKO_PUBLIC_URL:-http://localhost:8080}
      NEKO_CDP_URL: ${NEKO_CDP_URL:-}
      NEKO_USER_PASSWORD: ${NEKO_USER_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  neko:
    image: m1k1o/neko:chromium
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      NEKO_SCREEN: "1920x1080@30"
      NEKO_PASSWORD: ${NEKO_USER_PASSWORD}
      NEKO_PASSWORD_ADMIN: ${NEKO_ADMIN_PASSWORD}
      NEKO_EPR: "52000-52100"
      NEKO_ICELITE: "1"
    volumes:
      # Persistent Chromium profile: sign in to each service ONCE, cookies survive restarts.
      - neko-profile:/home/neko/.config/chromium
      # Chrome-hiding extension (see neko/README.md for how it gets loaded).
      - ./neko/extension:/opt/streamdeck-extension:ro
      # OPTIONAL — enables auto-navigation on Play via CDP. Generate the override first
      # (instructions in neko/README.md), then uncomment:
      # - ./neko/chromium.conf:/etc/neko/supervisord/chromium.conf:ro

volumes:
  pgdata:
  neko-profile:
