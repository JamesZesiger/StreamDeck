services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEKO_PUBLIC_URL: ${NEKO_PUBLIC_URL:-http://localhost:8080}
      NEKO_CDP_URL: ${NEKO_CDP_URL:-http://neko:9223}
      NEKO_USER_PASSWORD: ${NEKO_USER_PASSWORD}
    env_file:
      - .env
    volumes:
      # Site list + credentials (config/sites.json) — created on first startup.
      - ./config:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  neko:
    image: m1k1o/neko:chromium
    restart: unless-stopped
    # Fixed hostname: Chromium's profile SingletonLock embeds it; without this,
    # every recreate invalidates the lock and Chromium crash-loops.
    hostname: nekobrowser
    shm_size: 2gb
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      NEKO_SCREEN: "1920x1080@30"
      NEKO_PASSWORD: ${NEKO_USER_PASSWORD}
      NEKO_PASSWORD_ADMIN: ${NEKO_ADMIN_PASSWORD}
      NEKO_EPR: "52000-52100"
      NEKO_ICELITE: "1"
    volumes:
      # Persistent Chromium profile: sign in to each service ONCE, cookies survive restarts.
      - neko-profile:/home/neko/.config/chromium
      # Chrome-hiding extension (see neko/README.md for how it gets loaded).
      - ./neko/extension:/opt/streamdeck-extension:ro
      # Supervisord override: adds CDP (auto-navigation on Play), loads the
      # chrome-hiding extension, drops --bwsi so logins persist.
      - ./neko/chromium.conf:/etc/neko/supervisord/chromium.conf:ro
      # DevTools localhost-only workaround: forwards 9223 -> 127.0.0.1:9222.
      - ./neko/cdp_proxy.py:/opt/cdp_proxy.py:ro
      # Image policy ships DeveloperToolsAvailability=2, which silently blocks
      # page-level CDP (breaking auto-navigation); our copy sets it to 1.
      - ./neko/policies:/etc/chromium/policies/managed:ro

volumes:
  pgdata:
  neko-profile:
