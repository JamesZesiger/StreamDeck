<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StreamDeck{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  {% block nav %}
  <nav class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-end gap-x-4 gap-y-2">
      {% block nav_left %}{% endblock %}
      <a href="/" class="text-xl font-bold tracking-tight shrink-0 mr-auto">Stream<span class="text-red-500">Deck</span></a>
      {% block nav_extra %}{% endblock %}
      {% if active_profile %}
      <a href="/sites" class="text-sm text-zinc-400 hover:text-zinc-100 px-2 py-1.5">Sites</a>
      {% endif %}
      <select name="region" title="Watch region — only titles available here are shown"
              hx-post="/api/settings/region" hx-trigger="change" hx-swap="none"
              class="rounded-lg bg-transparent text-sm text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 px-1.5 py-1.5 cursor-pointer focus:outline-none border-none">
        <option value="" class="bg-zinc-900 text-zinc-100" {{ 'selected' if not current_region() }}>ALL</option>
        {% for code, name in regions %}
        <option value="{{ code }}" title="{{ name }}" class="bg-zinc-900 text-zinc-100"
                {{ 'selected' if code == current_region() }}>{{ code }}</option>
        {% endfor %}
      </select>
      <select name="lang" title="Metadata language"
              hx-post="/api/settings/language" hx-trigger="change" hx-swap="none"
              class="rounded-lg bg-transparent text-sm text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 px-1.5 py-1.5 cursor-pointer focus:outline-none border-none">
        {% for code, abbr, name in languages %}
        <option value="{{ code }}" title="{{ name }}" class="bg-zinc-900 text-zinc-100"
                {{ 'selected' if code == current_language() }}>{{ abbr }}</option>
        {% endfor %}
      </select>
      <details class="relative" id="settings-menu">
        <summary title="Settings"
                 class="list-none [&::-webkit-details-marker]:hidden cursor-pointer select-none rounded-lg p-2 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          </svg>
        </summary>
        <div class="absolute right-0 mt-2 w-64 rounded-xl bg-zinc-900 ring-1 ring-zinc-700 shadow-2xl z-50 p-4 space-y-3"
             hx-get="/settings/menu" hx-trigger="click from:closest details once" hx-swap="innerHTML">
          <p class="px-1 py-2 text-sm text-zinc-500">Loading…</p>
        </div>
      </details>
      {% if active_profile %}
      <details class="relative" id="profile-menu">
        <summary title="Profile: {{ active_profile.name }}"
                 class="list-none [&::-webkit-details-marker]:hidden cursor-pointer select-none">
          <span class="w-8 h-8 rounded-full bg-red-600 hover:bg-red-500 grid place-items-center text-sm font-bold">{{ active_profile.name[:1]|upper }}</span>
        </summary>
        <div class="absolute right-0 mt-2 w-60 rounded-xl bg-zinc-900 ring-1 ring-zinc-700 shadow-2xl overflow-hidden z-50"
             hx-get="/profiles/menu" hx-trigger="click from:closest details once" hx-swap="innerHTML">
          <p class="px-4 py-3 text-sm text-zinc-500">Loading…</p>
        </div>
      </details>
      {% endif %}
    </div>
  </nav>
  {% endblock %}
  <main class="{% block main_class %}max-w-7xl mx-auto px-4 py-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('click', (e) => {
      document.querySelectorAll('details[open]').forEach((d) => {
        if (!d.contains(e.target)) d.removeAttribute('open');
      });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('details[open]').forEach((d) => d.removeAttribute('open'));
      }
    });
  </script>
</body>
</html>
