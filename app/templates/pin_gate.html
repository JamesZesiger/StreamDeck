{% extends "base.html" %}
{% block title %}Locked — StreamDeck{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-zinc-900 ring-1 ring-zinc-800 rounded-xl p-6 space-y-3 text-center">
  <h1 class="font-semibold">Kid mode is on</h1>
  <p class="text-sm text-zinc-400">Enter the parent PIN to manage sites.</p>
  <form hx-post="/api/pin/unlock" hx-target="#gate-msg" hx-swap="innerHTML" class="flex gap-1.5 justify-center">
    <input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8"
           placeholder="PIN" required autocomplete="off" autofocus
           class="min-w-0 flex-1 rounded-lg bg-zinc-950 border border-zinc-700 focus:border-red-500 focus:outline-none px-3 py-2 text-sm">
    <button class="rounded-lg bg-zinc-100 text-zinc-900 hover:bg-white px-4 py-2 text-sm font-semibold shrink-0">Unlock</button>
  </form>
  <div id="gate-msg"></div>
  <a href="/" class="inline-block text-sm text-zinc-500 hover:text-zinc-300">Back to library</a>
</div>
{% endblock %}
