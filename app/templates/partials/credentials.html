<div class="bg-zinc-900 ring-1 ring-zinc-700 rounded-xl p-4 shadow-2xl text-sm space-y-2 w-72">
  <div class="flex items-center justify-between gap-2">
    <span class="text-zinc-400">Username</span>
    <button onclick="navigator.clipboard.writeText('{{ creds.username }}'); this.textContent='Copied ✓'"
            class="bg-zinc-800 hover:bg-zinc-700 rounded px-2 py-1 font-mono truncate max-w-44">{{ creds.username }}</button>
  </div>
  <div class="flex items-center justify-between gap-2">
    <span class="text-zinc-400">Password</span>
    <button onclick="navigator.clipboard.writeText('{{ creds.password }}'); this.textContent='Copied ✓'"
            class="bg-zinc-800 hover:bg-zinc-700 rounded px-2 py-1 font-mono">••••••••</button>
  </div>
  <button onclick="this.closest('div[id=creds]') ? this.closest('div[id=creds]').innerHTML='' : this.parentElement.remove()"
          class="text-xs text-zinc-500 hover:text-zinc-300">Close</button>
</div>
