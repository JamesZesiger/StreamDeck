<div class="rounded-2xl my-6 px-5 sm:px-6 py-4 bg-gradient-to-r from-amber-900/40 via-zinc-900 to-zinc-900 ring-1 ring-zinc-800">
  <div class="flex items-center gap-3 mb-3">
    <svg class="w-6 h-6 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
    <div class="flex-1 min-w-0">
      <p class="font-semibold">Left your services</p>
      <p class="text-sm text-zinc-400">These titles are no longer streamed by any of your sites — play links may be dead.</p>
    </div>
  </div>
  <div class="flex gap-3 overflow-x-auto pb-1">
    {% for g in leaving %}
    <a href="/titles/{{ g.primary.id }}" title="{{ g.primary.title }}" class="shrink-0 w-20 group">
      {% if g.primary.poster_url %}
      <img src="{{ g.primary.poster_url }}" alt="{{ g.primary.title }}"
           class="w-20 aspect-[2/3] object-cover rounded-lg ring-1 ring-zinc-800 group-hover:ring-amber-500/60 saturate-50 group-hover:saturate-100 transition">
      {% else %}
      <span class="block w-20 aspect-[2/3] rounded-lg ring-1 ring-zinc-800 bg-zinc-950 p-1.5 text-[11px] text-zinc-400 overflow-hidden">{{ g.primary.title }}</span>
      {% endif %}
      <span class="block text-[11px] text-zinc-400 truncate mt-1">{{ g.primary.title }}</span>
    </a>
    {% endfor %}
  </div>
</div>
