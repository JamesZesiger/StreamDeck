<div class="rounded-2xl my-6 px-5 sm:px-6 py-4 bg-zinc-900 ring-1 ring-zinc-800">
  <p class="font-semibold mb-3">Continue watching</p>
  <div class="flex gap-3 overflow-x-auto pb-1">
    {% for g in continuing %}
    <a href="/titles/{{ g.primary.id }}" title="{{ g.primary.title }} — {{ g.ep_label }}" class="shrink-0 w-20 group">
      {% if g.primary.poster_url %}
      <img src="{{ g.primary.poster_url }}" alt="{{ g.primary.title }}"
           class="w-20 aspect-[2/3] object-cover rounded-lg ring-1 ring-zinc-800 group-hover:ring-red-500/60 transition">
      {% else %}
      <span class="block w-20 aspect-[2/3] rounded-lg ring-1 ring-zinc-800 bg-zinc-950 p-1.5 text-[11px] text-zinc-400 overflow-hidden">{{ g.primary.title }}</span>
      {% endif %}
      <span class="block text-[11px] text-zinc-400 truncate mt-1">{{ g.primary.title }}</span>
      <span class="block text-[11px] text-red-400 font-semibold">{{ g.ep_label }}</span>
    </a>
    {% endfor %}
  </div>
</div>
