<div class="flex justify-end pt-1 pb-2">
  <button hx-post="/api/episodes/season"
          hx-vals='{"tmdb_id": {{ tmdb_id }}, "season": {{ season_number }}, "watched": "{{ '0' if all_watched else '1' }}"}'
          hx-target="closest .season-episodes" hx-swap="innerHTML" hx-disabled-elt="this"
          class="rounded-lg bg-zinc-800 hover:bg-zinc-700 disabled:opacity-50 px-3 py-1 text-xs">
    {{ 'Mark season unwatched' if all_watched else 'Mark season watched' }}</button>
</div>
<ul class="divide-y divide-zinc-800/60">
  {% for e in episodes %}
  <li class="flex items-center gap-3 py-1.5">
    {% set episode = e.episode %}
    {% set watched = e.episode in watched_eps %}
    {% include "partials/episode_toggle.html" %}
    <span class="text-xs text-zinc-500 w-8 shrink-0">E{{ e.episode }}</span>
    <span class="flex-1 min-w-0 text-sm truncate">{{ e.name }}</span>
    {% if e.air_date %}<span class="text-xs text-zinc-500 shrink-0">{{ e.air_date }}</span>{% endif %}
  </li>
  {% endfor %}
</ul>
