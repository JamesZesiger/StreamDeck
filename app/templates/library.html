{% extends "base.html" %}
{% block nav_extra %}
<div class="flex items-center gap-1.5">
  <a href="/" title="All services"
     class="px-2.5 py-1 rounded-full text-xs {{ 'bg-zinc-100 text-zinc-900' if not active_service else 'bg-zinc-800 hover:bg-zinc-700' }}">All</a>
  {% for s in services %}
  <a href="/?service={{ s.slug }}{{ '&watched=' + active_watched if active_watched else '' }}" title="{{ s.name }}"
     class="p-0.5 rounded-md {{ 'ring-2 ring-red-500' if active_service == s.slug else 'opacity-60 hover:opacity-100' }}">
    <img src="{{ s.icon_path }}" alt="{{ s.name }}" class="w-6 h-6 rounded">
  </a>
  {% endfor %}
  <a href="{{ '/?service=' + active_service if active_service else '/' }}{{ ('&' if active_service else '?') + 'watched=false' if active_watched != 'false' else '' }}"
     title="Show only unwatched"
     class="ml-1 px-2.5 py-1 rounded-full text-xs {{ 'bg-zinc-100 text-zinc-900' if active_watched == 'false' else 'bg-zinc-800 hover:bg-zinc-700' }}">Unwatched</a>
</div>
<select name="sort" title="Sort library"
        hx-get="/" hx-trigger="change" hx-target="#tile-grid" hx-swap="innerHTML"
        hx-include="[name='q']"
        hx-vals='{"service": "{{ active_service or '' }}", "watched": "{{ active_watched or '' }}"}'
        class="rounded-lg bg-zinc-900 border border-zinc-700 focus:border-red-500 focus:outline-none px-2 py-1.5 text-sm">
  <option value="title" {{ 'selected' if sort != 'added' }}>A–Z</option>
  <option value="added" {{ 'selected' if sort == 'added' }}>Recently added</option>
</select>
<input type="search" name="q" value="{{ q or '' }}" placeholder="Search library…"
       hx-get="/" hx-trigger="input changed delay:250ms, search" hx-target="#tile-grid" hx-swap="innerHTML"
       hx-include="[name='sort']"
       hx-vals='{"service": "{{ active_service or '' }}", "watched": "{{ active_watched or '' }}"}'
       autocomplete="off"
       class="w-40 sm:w-64 rounded-lg bg-zinc-900 border border-zinc-700 focus:border-red-500 focus:outline-none px-3 py-1.5 text-sm">
{% endblock %}
{% block content %}
<div id="tile-grid">
  {% include "partials/tile_grid.html" %}
</div>
{% endblock %}
