{% extends "base.html" %}
{% block content %}
<div class="flex flex-wrap items-center gap-2 mb-4">
  <a href="/" class="px-3 py-1 rounded-full text-sm {{ 'bg-zinc-100 text-zinc-900' if not active_service else 'bg-zinc-800 hover:bg-zinc-700' }}">All</a>
  {% for s in services %}
  <a href="/?service={{ s.slug }}" class="px-3 py-1 rounded-full text-sm flex items-center gap-1.5 {{ 'bg-zinc-100 text-zinc-900' if active_service == s.slug else 'bg-zinc-800 hover:bg-zinc-700' }}">
    <img src="{{ s.icon_path }}" alt="" class="w-4 h-4 rounded">{{ s.name }}
  </a>
  {% endfor %}
  <div class="flex-1"></div>
  <a href="/?watched=false{{ '&service=' + active_service if active_service else '' }}"
     class="px-3 py-1 rounded-full text-sm {{ 'bg-zinc-100 text-zinc-900' if active_watched == 'false' else 'bg-zinc-800 hover:bg-zinc-700' }}">Unwatched</a>
</div>

<div class="mb-6">
  <input type="search" name="q" value="{{ q or '' }}" placeholder="Search your library…"
         hx-get="/" hx-trigger="input changed delay:250ms, search" hx-target="#tile-grid" hx-swap="innerHTML"
         hx-vals='{"service": "{{ active_service or '' }}", "watched": "{{ active_watched or '' }}"}'
         autocomplete="off"
         class="w-full sm:max-w-md rounded-lg bg-zinc-900 border border-zinc-700 focus:border-red-500 focus:outline-none px-4 py-2">
</div>

<div id="tile-grid">
  {% include "partials/tile_grid.html" %}
</div>
{% endblock %}
