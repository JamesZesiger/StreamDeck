<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — StreamDeck</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #09090b; color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    h1 span { color: #ef4444; }
    p { color: #a1a1aa; margin: 0 0 1.5rem; }
    a {
      display: inline-block; padding: .6rem 1.4rem; border-radius: .75rem;
      background: #dc2626; color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stream<span>Deck</span> is offline</h1>
    <p>Can't reach the server — check that you're on the home network or VPN.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
